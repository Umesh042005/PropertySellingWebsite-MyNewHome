# All secrets/environment specific values come from environment variables.
# For local development put them in backend/.env (git-ignored, see .env.example).
spring.config.import=optional:file:.env[.properties]
spring.application.name=mynewhome

server.port=${PORT:8080}
# Respect X-Forwarded-* headers when running behind a reverse proxy / PaaS load balancer
server.forward-headers-strategy=framework

# ---------- Database (MySQL) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/propertydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Security ----------
# At least 32 characters. Generate one with: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
# 5 hours
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:18000000}
# Comma separated list of allowed frontend origins
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
# Google OAuth client id; leave empty to disable Google sign-in
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ---------- Gemini AI ----------
# Leave empty to disable AI description generation
gemini.api.key=${GEMINI_API_KEY:}
